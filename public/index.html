<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SG Bus Data Explorer</title>

    <!-- Leaflet styles -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <!-- App styles -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>SG Bus Data Explorer</h1>
      <div class="controls">
        <input id="search" type="text" placeholder="Search stops (name or road)" />
        <input id="service" type="text" placeholder="Service (e.g. 27)" />
        <button id="loadStops">Load Stops</button>
        <button id="loadRoutes">Load Routes</button>
        <button id="clear">Clear</button>
      </div>
    </header>

    <main>
      <div id="mapWrap">
        <!-- Map overlay buttons -->
        <div class="map-overlay">
          <button id="centerMap" title="Center map">📍</button>
          <button id="toggleFullscreen" title="Fullscreen">⛶</button>
        </div>
        <div id="map"></div>
      </div>
      <aside id="panel">
        <div class="section">
          <div class="row">
            <button id="checkHealth">Check API Health</button>
            <span id="healthStatus">Unknown</span>
          </div>
          <ul>
            <li><a href="/api" target="_blank">/api</a></li>
            <li><a href="/api/health" target="_blank">/api/health</a></li>
            <li><a href="/api/bus-stops?limit=10&format=geojson" target="_blank">/api/bus-stops</a></li>
            <li><a href="/api/bus-services?search=27" target="_blank">/api/bus-services</a></li>
            <li><a href="/api/bus-routes?service=133&format=geojson" target="_blank">/api/bus-routes</a></li>
            <li><a href="/api/arrivals?busStopCode=65011" target="_blank">/api/arrivals</a></li>
          </ul>
        </div>

        <!-- API endpoint helpers -->
        <div class="section">
          <h3 style="margin: 0 0 8px 0;">API Helpers</h3>
          <div class="row">
            <input id="apiStopsSearch" type="text" placeholder="Stops: search term (e.g. sengkang)" />
            <button id="openStopsApi">Open</button>
          </div>
          <div class="row">
            <input id="apiServiceSearch" type="text" placeholder="Services: service no (e.g. 27)" />
            <button id="openServiceApi">Open</button>
          </div>
          <div class="row">
            <input id="apiRouteService" type="text" placeholder="Routes: service no (e.g. 27)" />
            <select id="apiRouteFormat">
              <option value="json">JSON</option>
              <option value="geojson">GeoJSON</option>
            </select>
            <button id="openRouteApi">Open</button>
          </div>
          <div class="row">
            <input id="apiArrivalStop" type="text" placeholder="Arrivals: stop code (e.g. 65011)" />
            <input id="apiArrivalService" type="text" placeholder="Service (optional)" />
            <button id="openArrivalApi">Open</button>
          </div>
          <ul>
            <li><a href="/api/bus-stops?search=sengkang&limit=10&format=geojson" target="_blank">Stops: Sengkang (GeoJSON)</a></li>
            <li><a href="/api/bus-services?search=27" target="_blank">Services: 27</a></li>
            <li><a href="/api/bus-routes?service=133&format=geojson" target="_blank">Routes: 133 (GeoJSON)</a></li>
            <li><a href="/api/arrivals?busStopCode=65011" target="_blank">Arrivals: 65011</a></li>
          </ul>
        </div>

        <div class="section">
          <div class="row">
            <input id="arrStop" type="text" placeholder="Stop code (e.g. 65011)" />
            <input id="arrService" type="text" placeholder="Service (optional)" />
            <button id="fetchArrivals">Fetch Arrivals</button>
          </div>
          <ul id="arrivals"></ul>
        </div>
      </aside>
    </main>

    <!-- Leaflet script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- App script -->
    <script src="./app.js"></script>
  </body>
 </html>
